<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg, #090014, #28001f, #12001f);
}

.container {
    text-align: center;
    padding: 30px;
    z-index: 2;
    animation: fade 2s ease;
}

h1 {
    font-size: 40px;
    margin-bottom: 15px;
}

p {
    font-size: 18px;
    line-height: 1.6;
    opacity: .85;
}

button {
    margin-top: 25px;
    padding: 14px 30px;
    border: none;
    border-radius: 30px;
    background: #ff4f81;
    color: white;
    font-size: 17px;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    transform: scale(1.08);
}

#message {
    display: none;
    margin-top: 25px;
    font-size: 20px;
    line-height: 1.6;
}

.heart {
    position: absolute;
    bottom: -40px;
    animation: naik linear forwards;
}

@keyframes naik {
    from {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

@keyframes fade {
    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<audio id="music" loop>
    <source src="rahasia-hati.mp3" type="audio/mpeg">
</audio>

<div class="container">

    <h1>I Hope You Love Me Too ❤️</h1>

    <p>
        There is something<br>
        I've been keeping in my heart...
    </p>

    <button onclick="openMessage()">
        Open My Heart 💌
    </button>

    <div id="message">
        Maybe I can't say everything directly.<br>
        So I put it here instead.<br><br>

        <strong>I hope you love me too. ❤️</strong>
    </div>

</div>

<script>

function openMessage() {

    const music = document.getElementById("music");

    music.play();

    document.getElementById("message").style.display = "block";

}

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.fontSize =
        (15 + Math.random() * 25) + "px";

    heart.style.animationDuration =
        (4 + Math.random() * 5) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 9000);
}

setInterval(createHeart, 400);

</script>

</body>
</html>
